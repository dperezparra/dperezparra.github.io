[build]
  command = """
    set -e
    echo "=== Starting build process ==="
    echo "Node version: $(node --version)"
    echo "pnpm version: $(pnpm --version)"
    echo "Hugo version: $(hugo version)"
    echo "Go version: $(go version || echo 'Go not available')"

    echo "=== Installing dependencies ==="
    pnpm install --frozen-lockfile

    echo "=== Running Hugo build ==="
    hugo --gc --minify -b $URL --printI18nWarnings --printPathWarnings

    echo "=== Running Pagefind indexing ==="
    pnpm exec pagefind --site public

    echo "=== Build completed successfully ==="
  """
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.152.1"
  GO_VERSION = "1.21.5"
  NODE_VERSION = "22"
  # NOTE: enableGitInfo is set in config/_default/hugo.yaml. Do not duplicate
  # it here as HUGO_ENABLEGITINFO - the two previously disagreed.
  HUGO_LOG_I18N_WARNINGS = "true"
  HUGO_LOG_WARNINGS = "true"
  FORCE_COLOR = "1"

[context.production.environment]
  HUGO_ENV = "production"

[context.deploy-preview]
  command = """
    set -e
    echo "=== Deploy Preview Build ==="
    echo "Deploy URL: $DEPLOY_PRIME_URL"
    pnpm install --frozen-lockfile
    hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL --printI18nWarnings --printPathWarnings
    pnpm exec pagefind --site public
  """

[context.branch-deploy]
  command = """
    set -e
    echo "=== Branch Deploy Build ==="
    echo "Deploy URL: $DEPLOY_PRIME_URL"
    pnpm install --frozen-lockfile
    hugo --gc --minify -b $DEPLOY_PRIME_URL --printI18nWarnings --printPathWarnings
    pnpm exec pagefind --site public
  """

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
  [plugins.inputs]
    debug = true
