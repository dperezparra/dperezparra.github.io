# Configuration of Hugo
# Guide: https://docs.hugoblox.com/tutorial/
# Hugo Documentation: https://gohugo.io/getting-started/configuration/#all-configuration-settings
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Website name
title: Daniel Pérez-Parra
# Website URL.
# NOTE: the GitHub Pages workflow overrides this at build time with the real
# Pages base URL (`--baseURL "${{ steps.pages.outputs.base_url }}/"`), so the
# deployed site follows whatever the repository is called. This value is what
# local builds and `hugo server` use.
baseURL: 'https://dperezparra.github.io/'

############################
## LANGUAGE
############################

defaultContentLanguage: en
hasCJKLanguage: false
defaultContentLanguageInSubdir: false
removePathAccents: true

############################
## ADVANCED
############################

build:
  writeStats: true
# Derive page Lastmod from git history. Both deploy paths support this:
# the GitHub Pages workflow checks out with fetch-depth: 0, and Netlify
# provides full history. This is the single source of truth - do not also
# set HUGO_ENABLEGITINFO in netlify.toml.
enableGitInfo: true
summaryLength: 30
pagination:
  pagerSize: 10
enableEmoji: true
enableRobotsTXT: true
footnotereturnlinkcontents: <sup>^</sup>
ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
# The starter turns alias pages off because it emits a Netlify `_redirects`
# file from the same front matter instead. GitHub Pages ignores that file, so
# with it off the /my-website/ aliases produced nothing at all. Hugo's alias
# HTML is the only redirect mechanism GitHub Pages honours; `_redirects` is
# still written alongside it, so Netlify keeps its real 301s.
disableAliases: false
outputs:
  home: [HTML, RSS, headers, redirects, backlinks]
  section: [HTML, RSS]
imaging:
  resampleFilter: lanczos
  quality: 90
  anchor: smart
  hint: picture
timeout: 600000
taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types
markup:
  _merge: deep
  highlight:
    lineNos: false
security:
  _merge: deep
sitemap:
  _merge: deep
