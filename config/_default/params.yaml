# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: purple

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Daniel Pérez-Parra — research, teaching and fieldwork on gender, health, norms and community development.'
    # Handle for the `twitter:site` card meta, so a shared link is attributed
    # to this account rather than to nobody. It held the starter template's own
    # handle until now.
    twitter: 'danielperezpa'
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    fixed_to_top: true
    transparent: false
    align: center
    show_search: true
    show_theme_chooser: true
    # The theme reads `show_translations`, not `show_language`. Shows the globe
    # language switcher (English / Español / Français) on translated pages.
    show_translations: true
    # Institution logos just before the search button are supported by the
    # shadowed navbar (layouts/partials/components/headers/navbar.html) via an
    # `institution_logos:` list here (filename / url / alt / title). Removed:
    # the full IRD logo now sits under the name on the home page, and the
    # affiliation logos are listed in the home page's About column.
# Site footer
footer:
  copyright:
    notice: '© {year} Daniel Pérez-Parra. This work is licensed under {license}'
    # Renders as CC BY-NC-ND 4.0.
    # NOTE: `share_alike` only takes effect when `allow_derivatives` is true -
    # ND and SA are mutually exclusive. To publish as CC BY-NC-SA instead, set
    # allow_derivatives: true and share_alike: true.
    license:
      enable: true
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
