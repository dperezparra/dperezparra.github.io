# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: system
  color: purple

# SEO
marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: ''
    description: 'Daniel Pérez-Parra — research, teaching and fieldwork on gender, health, norms and community development.'
    # Twitter/X handle for `twitter:site` card meta. Left empty on purpose -
    # this was the starter template's own handle. Add yours to enable it.
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    fixed_to_top: true
    transparent: false
    align: center
    show_search: true
    show_theme_chooser: true
    # The theme reads `show_translations`, not `show_language`.
    show_translations: false
    # Institution logos shown just before the search button, in this order.
    # Rendered by the shadowed navbar at
    # layouts/partials/components/headers/navbar.html
    # IRD uses the symbol rather than the full lockup: at navbar height the
    # "Institut de Recherche pour le Développement" wordmark is illegible.
    institution_logos:
      - filename: ird-mark.png
        url: https://en.ird.fr/
        alt: 'Institut de Recherche pour le Développement (IRD)'
        title: 'Institut de Recherche pour le Développement (IRD)'
      - filename: dauphine-logo.png
        url: https://leda.dauphine.fr/
        alt: 'Université Paris-Dauphine — PSL (LEDa-DIAL)'
        title: 'Université Paris-Dauphine — PSL (LEDa-DIAL)'
      - filename: paris1-logo.png
        url: https://centredeconomiesorbonne.cnrs.fr/
        alt: 'Université Paris 1 Panthéon-Sorbonne (CES)'
        title: 'Université Paris 1 Panthéon-Sorbonne (CES)'
# Site footer
footer:
  copyright:
    notice: '© {year} Daniel Pérez-Parra. This work is licensed under {license}'
    # Renders as CC BY-NC-ND 4.0.
    # NOTE: `share_alike` only takes effect when `allow_derivatives` is true -
    # ND and SA are mutually exclusive. To publish as CC BY-NC-SA instead, set
    # allow_derivatives: true and share_alike: true.
    license:
      enable: true
      allow_derivatives: false
      share_alike: false
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: false
  privacy_pack:
    enable: false
