# Country outlines for the Fieldwork mission maps.
#
# Source: Natural Earth 1:50m Admin 0 countries (public domain), simplified with
# Douglas-Peucker to keep the inline SVG small. Mainland ring only.
#
# `path` is already projected into a 0,0 -> width,height box using a plain
# linear lon/lat mapping. layouts/_partials/views/mission.html places the site
# pins with the SAME mapping, so bounds and path must always agree:
#
#     x = (lon - lon_min) / (lon_max - lon_min) * width
#     y = (lat_max - lat) / (lat_max - lat_min) * height
#
# To add a country, generate its path with that identical transform.

