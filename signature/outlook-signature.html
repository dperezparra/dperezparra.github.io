     E-mail signature. Open this file in a browser, select all (Cmd+A), copy,
     and paste into Outlook > Settings > Signatures.

     Built for Outlook, which on Windows renders mail through Word's engine -
     hence tables rather than flexbox, inline styles rather than classes, an
     explicit width/height on the image, and mso-line-height-rule so the line
     spacing does not drift. It is deliberately plain HTML: nothing here needs
     a stylesheet to survive being pasted into a mail client.

     The logo is served from the site at a stable path, so the signature keeps
     working from any machine and any mail client.
--------------------------------------------------------------------------- */ -->
